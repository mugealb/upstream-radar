name: Update Brent price

on:
  schedule:
    - cron: "17 6 * * 1-6"   # every day Mon-Sat at 06:17 UTC (09:17 Turkey time)
  workflow_dispatch:          # adds a "Run workflow" button to run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Brent from EIA
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_brent.py

      - name: Write AI market insight
        continue-on-error: true   # if this fails, the Brent update is still saved
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/write_insight.py

      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brent.json
          git add data/insight.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update Brent price and market insight" && git push)
